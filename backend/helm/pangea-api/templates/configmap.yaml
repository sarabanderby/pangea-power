apiVersion: v1
kind: ConfigMap
metadata:
  name: pangea-api-config
  labels:
    app.kubernetes.io/name: pangea-api
# Runtime-tunable knobs. Edit + `oc rollout restart deploy/pangea-api`, no rebuild.
data:
  WIND_CUTOUT_MS: "22"
  AGENT_TEMPERATURE: "0.2"
  AGENT_MAX_TOKENS: "160"
  AGENT_REPETITION_PENALTY: "1.1"
  AGENT_FREQUENCY_PENALTY: "0.2"
  AGENT_PRESENCE_PENALTY: "0.2"
  LAYA_ENABLED: "true"
  LAYA_CONFIDENCE_FLOOR: "0.5"
  TTS_ENABLED: "true"
  KOKORO_VOICE: "bf_emma"
  KOKORO_LANG: "en-gb"
  KOKORO_SPEED: "1.0"
