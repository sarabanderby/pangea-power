apiVersion: v1
kind: ConfigMap
metadata:
  name: pangea-api-config
  labels:
    app.kubernetes.io/name: pangea-api
# Runtime-tunable knobs. Edit + `oc rollout restart deploy/pangea-api`, no rebuild.
data:
  WIND_CUTOUT_MS: "22"
  AGENT_TEMPERATURE: "0.35"
  AGENT_MAX_TOKENS: "512"
  AGENT_REPETITION_PENALTY: "1.2"
  AGENT_FREQUENCY_PENALTY: "0.4"
  AGENT_PRESENCE_PENALTY: "0.4"
  AGENT_SYSTEM_PROMPT: >-
    You are Pangea, the operations assistant for the Pangea Energy and Power
    fleet (wind, solar and wave sites). Answer the supervisor concisely and
    factually using the dashboard state given as context. Prefer specific
    numbers and site names. If the context does not contain the answer, say so
    plainly. Keep replies to a sentence or two.
