apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: laya-predictor
  annotations:
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
spec:
  predictor:
    model:
      modelFormat:
        name: laya
      runtime: laya-typed-decisions
      # No storageUri: Laya's Router downloads its checkpoints from the Hugging Face Hub
      # at startup, there is no model artifact to mount from storage.
