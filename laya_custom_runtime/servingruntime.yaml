apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: laya-typed-decisions
spec:
  supportedModelFormats:
    - name: laya
      version: "1"
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/rlundber/laya-runtime:1.0
      args:
        - --model_name={{.Name}}
        - --http_port=8080
        # - --preload           # on by default; drop to --no-preload for lazy loading
        # - --device=cuda       # defaults to Laya's own device detection
      # env:
      #   - name: HF_TOKEN      # only needed for private/gated checkpoints
      #     valueFrom:
      #       secretKeyRef:
      #         name: hf-token
      #         key: token
      ports:
        - containerPort: 8080
          protocol: TCP
